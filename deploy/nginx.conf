worker_processes 1;
worker_rlimit_nofile 65536;
events { worker_connections 30000; }

http {
  access_log off;
  # Docker's DNS; re-resolve so a re-created app container (new IP) doesn't
  # leave nginx pointing at the old one.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream app {
    zone app 64k;
    server app:3000 resolve;
    keepalive 128;
  }
  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: the app rate-limits on the first entry,
    # so a client-supplied X-Forwarded-For must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;

    location / { proxy_pass http://app; }

    location = /api/stream {
      proxy_pass http://app;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }
  }
}
