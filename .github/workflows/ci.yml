name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx vitest run tests/unit
      - run: npx next build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit + integration tests against Postgres 18 and Redis 8 (compose)
        run: make test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Playwright against the full stack
        run: make e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color app worker edge migrate
